<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dorksk Checker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- LOGO -->
        <div class="logo-container">
            <img src="https://via.placeholder.com/120x120/000000/FFFFFF?text=D" alt="Logo" id="logo">
        </div>

        <!-- ANA BUTONLAR -->
        <div class="main-buttons">
            <button class="btn-primary" onclick="joinChannel()">📢 Join Channel</button>
            <button class="btn-primary" onclick="joinChat()">💬 Join Chat</button>
        </div>

        <!-- VERIFICATION -->
        <div class="verify-section">
            <button class="btn-verify" onclick="verify()">🔓 Verify</button>
        </div>

        <!-- HIDDEN AUTH (Verify sonrası görünür) -->
        <div id="auth-section" style="display:none;">
            <h2>Welcome!</h2>
            <button class="btn-auth" onclick="register()">📝 Register</button>
            <button class="btn-auth" onclick="login()">🔑 Login</button>
        </div>

        <!-- CARD CHECKER (Login sonrası) -->
        <div id="card-section" style="display:none;">
            <h3>💳 Card Checker</h3>
            <input type="text" id="cc-input" placeholder="4111111111111111|12|26|123">
            <button onclick="checkCard()">Check</button>
            <div id="result"></div>

            <!-- Kart Listesi -->
            <div id="card-list">
                <div class="card-item approved">✅ Approved - 4111****1111</div>
                <div class="card-item declined">❌ Declined - 5111****2222</div>
                <div class="card-item insufficient">⚠️ Insufficient Funds - 6111****3333</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
