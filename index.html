<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dorksk Checker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- GTA Logo -->
        <div class="logo-container">
            <img src="https://i.imgur.com/YOUR_GTA_LOGO.png" alt="GTA Logo" id="logo" 
                 onerror="this.src='https://via.placeholder.com/150x150/000/FFF?text=GTA'">
            <div class="logo-glow"></div>
        </div>

        <h1 class="title">💎 Dorksk Checker</h1>
        <p class="subtitle">Premium Card Verification Service</p>

        <!-- Channel Buttons -->
        <div class="main-buttons">
            <button class="btn-primary" onclick="joinChannel()">
                <span>📢</span> Join Channel
            </button>
            <button class="btn-primary" onclick="joinChat()">
                <span>💬</span> Join Chat
            </button>
        </div>

        <!-- Card Input -->
        <div class="input-section">
            <input type="text" id="cc-input" placeholder="4111111111111111|12|26|123" 
                   class="cc-input" spellcheck="false">
            <button class="btn-check" onclick="checkCard()">🚀 Check</button>
        </div>

        <!-- Result -->
        <div id="result" class="result-box"></div>

        <!-- Quick Stats -->
        <div class="stats-container" id="stats">
            <div class="stat-item approved">
                <span class="stat-number" id="approved-count">0</span>
                <span class="stat-label">✅ Approved</span>
            </div>
            <div class="stat-item declined">
                <span class="stat-number" id="declined-count">0</span>
                <span class="stat-label">❌ Declined</span>
            </div>
            <div class="stat-item insufficient">
                <span class="stat-number" id="insufficient-count">0</span>
                <span class="stat-label">⚠️ Insufficient</span>
            </div>
        </div>

        <!-- Admin Button -->
        <button class="btn-admin" onclick="openAdmin()">🔐 Admin Panel</button>

        <!-- Auth Section (Hidden) -->
        <div id="auth-section" style="display:none;">
            <h2>🎯 Welcome!</h2>
            <button class="btn-auth" onclick="register()">📝 Register</button>
            <button class="btn-auth" onclick="login()">🔑 Login</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
