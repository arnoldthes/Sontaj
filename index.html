<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dorksk Checker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #121212;
            border-radius: 28px;
            padding: 24px 20px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid #1e1e1e;
        }

        /* ===== LOGO ===== */
        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 2px solid #2a2a2a;
            object-fit: cover;
        }

        /* ===== TYPOGRAPHY ===== */
        .brand {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .sub {
            text-align: center;
            font-size: 13px;
            color: #666;
            letter-spacing: 1px;
            margin-bottom: 28px;
        }

        /* ===== INPUT ===== */
        .card-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .card-input-area input {
            flex: 1;
            padding: 16px 18px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            outline: none;
            transition: border-color 0.3s;
        }

        .card-input-area input:focus {
            border-color: #ffd700;
        }

        .card-input-area input::placeholder {
            color: #444;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            letter-spacing: 0;
        }

        .card-input-area button {
            padding: 16px 28px;
            background: linear-gradient(135deg, #ffd700, #f57c00);
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            color: #000;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .card-input-area button:active {
            transform: scale(0.95);
        }

        /* ===== RESULT ===== */
        .result-box {
            padding: 16px;
            border-radius: 14px;
            background: #1a1a1a;
            margin: 12px 0 20px;
            font-weight: 600;
            font-size: 15px;
            display: none;
            word-break: break-all;
            border-left: 4px solid transparent;
        }

        .result-box.approved {
            display: block;
            border-left-color: #00e676;
            color: #00e676;
        }

        .result-box.declined {
            display: block;
            border-left-color: #ff1744;
            color: #ff1744;
        }

        .result-box.loading {
            display: block;
            border-left-color: #ffd700;
            color: #ffd700;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ===== STATS (basit) ===== */
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0 12px;
        }

        .stats div {
            text-align: center;
        }

        .stats .number {
            font-size: 24px;
            font-weight: 700;
        }

        .stats .label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stats .approved .number { color: #00e676; }
        .stats .declined .number { color: #ff1744; }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            font-size: 12px;
            color: #333;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <img src="https://i.imgur.com/3wQkz7M.png" alt="GTA Logo" 
                 onerror="this.src='https://via.placeholder.com/100x100/1a1a1a/FFD700?text=GTA'">
        </div>

        <div class="brand">Dorksk Checker</div>
        <div class="sub">Premium Card Verification</div>

        <!-- Kart girişi -->
        <div class="card-input-area">
            <input type="text" id="cc-input" placeholder="4111111111111111 | 12 | 26 | 123" 
                   autocomplete="off" spellcheck="false" />
            <button onclick="checkCard()">Check</button>
        </div>

        <!-- Sonuç -->
        <div id="result" class="result-box"></div>

        <!-- Basit istatistikler -->
        <div class="stats">
            <div class="approved">
                <div class="number" id="approved-count">0</div>
                <div class="label">✅ Approved</div>
            </div>
            <div class="declined">
                <div class="number" id="declined-count">0</div>
                <div class="label">❌ Declined</div>
            </div>
        </div>

        <div class="footer">Telegram Mini App · v1.0</div>
    </div>

    <script>
        // ==================== TELEGRAM ====================
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user || { id: 'guest', username: 'Guest' };

        // ==================== DOM REFS ====================
        const input = document.getElementById('cc-input');
        const resultDiv = document.getElementById('result');
        const approvedSpan = document.getElementById('approved-count');
        const declinedSpan = document.getElementById('declined-count');

        let approvedCount = 0;
        let declinedCount = 0;

        // ==================== F12 ENGELLEME ====================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
                (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
                tg.showAlert('🔒 Developer tools disabled.');
            }
        });
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // ==================== INPUT TEMİZLE ====================
        input.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9|]/g, '');
        });

        // ==================== KART KONTROL ====================
        async function checkCard() {
            const raw = input.value.trim();
            if (!raw) {
                tg.showAlert('⚠️ Enter a card.');
                return;
            }

            // Format kontrolü: 15-19 rakam | 1-2 rakam | 2-4 rakam | 3-4 rakam
            const cleaned = raw.replace(/\s/g, '');
            const regex = /^(\d{15,19})\|(\d{1,2})\|(\d{2,4})\|(\d{3,4})$/;
            if (!regex.test(cleaned)) {
                tg.showAlert('❌ Invalid format. Use: NUMBER|MM|YY|CVV');
                return;
            }

            // Loading
            resultDiv.textContent = '⏳ Processing...';
            resultDiv.className = 'result-box loading';

            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cc: cleaned,
                        user_id: user.id,
                        user_name: user.username || 'Anonymous'
                    })
                });

                const data = await response.json();

                // Sonucu göster
                resultDiv.textContent = data.result;
                resultDiv.className = `result-box ${data.status}`;

                // İstatistikleri güncelle
                if (data.status === 'approved') {
                    approvedCount++;
                    approvedSpan.textContent = approvedCount;
                    tg.showAlert('✅ Card Approved!');
                } else {
                    declinedCount++;
                    declinedSpan.textContent = declinedCount;
                    tg.showAlert('❌ Card Declined.');
                }

            } catch (err) {
                resultDiv.textContent = '❌ Server error. Try again.';
                resultDiv.className = 'result-box declined';
                tg.showAlert('⚠️ Connection error.');
            }
        }

        // ==================== ENTER İLE GÖNDER ====================
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkCard();
        });
    </script>
</body>
</html>
