<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Randevu Al | Sağlam Sondaj</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #f6f9fc;
            color: #0a1a2b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            background: #0b1424;
            color: #e6edf5;
        }

        .form-container {
            max-width: 540px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            transition: background 0.3s, border 0.3s;
        }

        body.dark .form-container {
            background: #132033;
            border-color: #2a3a4f;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
            transition: 0.2s;
        }

        .back-link:hover {
            color: #0a2a44;
        }

        body.dark .back-link {
            color: #94a3b8;
        }
        body.dark .back-link:hover {
            color: #60a5fa;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header .icon-big {
            font-size: 48px;
            color: #0a2a44;
            display: block;
            margin-bottom: 4px;
        }

        body.dark .form-header .icon-big {
            color: #60a5fa;
        }

        .form-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0a2a44;
        }

        body.dark .form-header h1 {
            color: #f1f5f9;
        }

        .form-header p {
            color: #64748b;
            font-size: 15px;
            margin-top: 4px;
        }

        body.dark .form-header p {
            color: #94a3b8;
        }

        .form-header p strong {
            color: #0a2a44;
        }

        body.dark .form-header p strong {
            color: #60a5fa;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #0a1a2b;
            margin-bottom: 5px;
        }

        body.dark .form-group label {
            color: #e2e8f0;
        }

        .form-group label i {
            margin-right: 6px;
            color: #0a2a44;
        }

        body.dark .form-group label i {
            color: #60a5fa;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: #fafbfc;
            color: #0a1a2b;
            font-size: 15px;
            transition: 0.2s;
            outline: none;
            font-family: inherit;
        }

        body.dark .form-group input,
        body.dark .form-group select,
        body.dark .form-group textarea {
            background: #2a3a4f;
            border-color: #475569;
            color: #e2e8f0;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #0a2a44;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(10, 42, 68, 0.06);
        }

        body.dark .form-group input:focus,
        body.dark .form-group select:focus,
        body.dark .form-group textarea:focus {
            border-color: #60a5fa;
            background: #132033;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.08);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #94a3b8;
        }

        .form-group select option {
            background: #fff;
            color: #0a1a2b;
        }

        body.dark .form-group select option {
            background: #2a3a4f;
            color: #e2e8f0;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .indirim-badge {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0 24px;
            font-size: 14px;
            border: 1px solid #e2e8f0;
            color: #0a1a2b;
        }

        body.dark .indirim-badge {
            background: #2a3a4f;
            border-color: #475569;
            color: #e2e8f0;
        }

        .indirim-badge i {
            font-size: 20px;
            color: #0a2a44;
        }

        body.dark .indirim-badge i {
            color: #60a5fa;
        }

        .indirim-badge strong {
            color: #0a2a44;
        }

        body.dark .indirim-badge strong {
            color: #f1f5f9;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 60px;
            background: #0a2a44;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 6px;
            box-shadow: 0 4px 12px rgba(10, 42, 68, 0.15);
        }

        .btn-submit:hover {
            background: #0d3555;
            transform: scale(1.01);
        }

        body.dark .btn-submit {
            background: #3b82f6;
        }

        body.dark .btn-submit:hover {
            background: #2563eb;
        }

        .btn-submit i {
            font-size: 20px;
        }

        .van-warning {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-top: 20px;
            border-top: 1px solid #e2e8f0;
            padding-top: 18px;
        }

        body.dark .van-warning {
            color: #94a3b8;
            border-color: #2a3a4f;
        }

        .van-warning i {
            color: #0a2a44;
        }

        body.dark .van-warning i {
            color: #60a5fa;
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 24px 18px;
            }
            .form-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Ana Sayfa
        </a>

        <div class="form-header">
            <span class="icon-big"><i class="fas fa-calendar-plus"></i></span>
            <h1>Randevu Al</h1>
            <p>Sadece <strong>Van</strong> ilinde hizmet vermekteyiz</p>
        </div>

        <div class="indirim-badge">
            <i class="fas fa-award"></i>
            <span><strong>Vakıf indirimi</strong> — %15 özel fırsat</span>
        </div>

        <form id="randevuForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Ad Soyad</label>
                <input type="text" id="adSoyad" placeholder="Adınız ve soyadınız" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Telefon</label>
                <input type="tel" id="telefon" placeholder="05xx xxx xx xx" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-city"></i> Şehir</label>
                <select id="sehir" required>
                    <option value="" disabled selected>Şehir seçin</option>
                    <option value="Van" selected>Van</option>
                    <option value="Diğer" disabled>Diğer iller (hizmet yok)</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-map-pin"></i> İlçe</label>
                <select id="ilce" required>
                    <option value="" disabled selected>İlçe seçin</option>
                    <option value="Merkez">Merkez</option>
                    <option value="Erciş">Erciş</option>
                    <option value="Gevaş">Gevaş</option>
                    <option value="Gürpınar">Gürpınar</option>
                    <option value="Muradiye">Muradiye</option>
                    <option value="Özalp">Özalp</option>
                    <option value="Bahçesaray">Bahçesaray</option>
                    <option value="Çaldıran">Çaldıran</option>
                    <option value="Çatak">Çatak</option>
                    <option value="Edremit">Edremit</option>
                    <option value="Saray">Saray</option>
                    <option value="Başkale">Başkale</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-pen"></i> Not / Açıklama</label>
                <textarea id="not" placeholder="Varsa eklemek istedikleriniz..."></textarea>
            </div>
            <button type="submit" class="btn-submit">
                <i class="fab fa-whatsapp"></i> Gönder & WhatsApp ile İlet
            </button>
        </form>

        <div class="van-warning">
            <i class="fas fa-map-marker-alt"></i> Yalnızca Van ili içi randevu alınabilir.
        </div>
    </div>

    <script>
        // ===== TEMA =====
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
            }
        }
        const theme = localStorage.getItem('sontajTheme') || 'light';
        applyTheme(theme);

        // ===== FORM =====
        document.getElementById('randevuForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const ad = document.getElementById('adSoyad').value.trim();
            const tel = document.getElementById('telefon').value.trim();
            const sehir = document.getElementById('sehir').value;
            const ilce = document.getElementById('ilce').value;
            const not = document.getElementById('not').value.trim();

            if (!ad || !tel || !sehir || !ilce) {
                alert('Lütfen tüm zorunlu alanları doldurun.');
                return;
            }
            if (tel.length < 10) {
                alert('Lütfen geçerli bir telefon numarası girin.');
                return;
            }

            const mesaj =
                `📋 *Yeni Randevu Talebi (Sağlam Sondaj)*%0A%0A` +
                `👤 *Ad Soyad:* ${ad}%0A` +
                `📞 *Telefon:* ${tel}%0A` +
                `📍 *Şehir:* ${sehir}%0A` +
                `🏘️ *İlçe:* ${ilce}%0A` +
                `📝 *Not:* ${not || '—'}`;

            const phone = '905317681185';
            window.open(`https://wa.me/${phone}?text=${mesaj}`, '_blank');
        });
    </script>

</body>
</html>
